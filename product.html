<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product – R.K. Tech Laser</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body>
<div id="hdr"></div>
<div class="ptitle"><div class="wrap"><h1 id="t"></h1><small>Home › Products › <span id="b"></span></small></div></div>
<section><div class="wrap split"><div class="ph" id="img"></div><div><p id="body" style="margin-bottom:16px"></p><ul class="list" id="pts"></ul><p style="margin:18px 0">Specifications and pricing depend on model. Contact us for a quotation.</p><a class="btn" id="q">Request a Quote</a></div></div></section>
<section class="alt"><div class="wrap"><div class="sec-title"><h2>Other Products</h2></div><div class="grid g3" id="others"></div></div></section>
<div id="ftr"></div><script src="assets/site.js"></script>
<script>const id=new URLSearchParams(location.search).get("id");const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];
document.title=p.name+" – R.K. Tech Laser";t.textContent=b.textContent=img.innerHTML=`<img src="images/products/${p.id}.jpg" alt="${p.name}">`;body.textContent=p.body;
pts.innerHTML=p.pts.map(x=>`<li>${x}</li>`).join("");q.href="https://wa.me/91"+BIZ.phone+"?text="+encodeURIComponent("Hello, I want a quote for: "+p.name);q.target="_blank";
others.innerHTML=PRODUCTS.filter(x=>x!==p).slice(0,3).map(x=>`<div class="card"><div class="ph"><img src="images/products/${x.id}.jpg" alt="${x.name}"></div><div class="b"><h3>${x.name}</h3><p>${x.short}</p><a class="more" href="product.html?id=${x.id}">Read More →</a></div></div>`).join("")</script></body></html>
